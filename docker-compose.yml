services:
  mysql:
    image: mysql:8
    container_name: arca-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: arca_dev
      MYSQL_USER: arca_user
      MYSQL_PASSWORD: arca_pass
    volumes:
      - arca_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  arca_mysql_data:
