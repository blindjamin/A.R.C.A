<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono de la app instalada (PWA): la hoja del login sobre el degradado de
       marca. A sangre completa y con la hoja dentro del 50 % central, así sirve
       también como ícono "maskable" (Android lo recorta en círculo o squircle). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0f6b45" />
      <stop offset="0.5" stop-color="#138a57" />
      <stop offset="1" stop-color="#1bb46f" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)" />
  <g transform="translate(100.75 100.75) scale(13.5)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
  </g>
</svg>
